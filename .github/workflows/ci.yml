name: khipu-consensus-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11" }
      - run: pip install cryptography
      - run: python python/tests/test_vectors.py
      - name: Install szl-receipt (PCGI spine) + pytest
        run: |
          pip install pytest
          pip install "git+https://github.com/szl-holdings/szl-receipt.git@v0.2.0"
      - name: PCGI spine fold tests
        run: cd python && python -m pytest tests/test_spine.py -q
      - name: Adversarial Byzantine fault-injection tests
        run: cd python && python -m pytest tests/test_adversary.py -q
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.22" }
      - run: cd go && go test ./...
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with: { node-version: "20" }
      - run: cd typescript && npx --yes esbuild test/vectors.test.ts --bundle --platform=node --format=cjs --define:__dirname='"'"$PWD/test"'"' --outfile=/tmp/t.cjs && node /tmp/t.cjs
