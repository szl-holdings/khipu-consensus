name: khipu-consensus-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with: { python-version: "3.11" }
      - run: pip install cryptography
      - run: python python/tests/test_vectors.py
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with: { go-version: "1.22" }
      - run: cd go && go test ./...
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with: { node-version: "20" }
      - run: cd typescript && npx --yes esbuild test/vectors.test.ts --bundle --platform=node --format=cjs --define:__dirname='"'"$PWD/test"'"' --outfile=/tmp/t.cjs && node /tmp/t.cjs
