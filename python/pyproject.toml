[project]
name = "khipu-consensus"
version = "0.1.0"
description = "Byzantine-fault-tolerant multi-party signed agreement (3-of-4 BFT) over DSSE/cosign per-witness signatures."
license = { text = "Apache-2.0" }
authors = [{ name = "Yachay", email = "yachay@szlholdings.dev" }]
requires-python = ">=3.9"
dependencies = ["cryptography>=41.0"]

[project.optional-dependencies]
# Public witness API server (service/app.py) — the FastAPI surface.
service = ["fastapi>=0.100", "uvicorn>=0.23", "pydantic>=2.0"]
# Remote SDK transport (KhipuWitnessClient base_url=...).
remote = ["requests>=2.28"]
# PCGI spine fold (khipu_consensus/spine.py) — a witnessed decision as ONE
# canonical szl-receipt. Optional: the core BFT primitives never depend on it.
spine = ["szl-receipt>=0.2.0"]

[project.scripts]
khipu-verify = "khipu_consensus.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
